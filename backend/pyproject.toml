[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-data-converter"
version = "0.1.0"
description = "Convert FinDatEx TPT (V7/V8) files to FundsXML 4 and back."
requires-python = ">=3.12"
authors = [{ name = "Karl Kauc" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "lxml>=5.3",
    "openpyxl>=3.1",
    "pydantic>=2.8",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    "pyyaml>=6.0",
    # usage statistics (app/usage): Postgres writer, GeoLite2 country lookup and download
    "psycopg[binary]>=3.2",
    "geoip2>=4.8",
    "httpx>=0.27",
    # server-rendered content pages (app/content)
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["schema/*.xsd", "spec/*.json", "mapping/*.json", "samples/*", "content/template.html", "content/faq.toml", "content/pages/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
