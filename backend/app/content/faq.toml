# Home page FAQ: rendered into the static shell (crawlers, no-JS), as FAQPage
# JSON-LD, and available to the SPA via /api/content/faq. Answers are Markdown.

[[faq]]
q = "What does the TPT converter do?"
a = """
It converts a FinDatEx Tripartite Template (TPT V7 or V8) file — Excel or CSV — into a FundsXML 4.2.11 document,
and a FundsXML 4 document back into a TPT file. The FundsXML output contains the Solvency II TPT block and the
regular fund, position and asset structures, and is validated against the FundsXML XSD.
"""

[[faq]]
q = "Which TPT versions and file formats are supported?"
a = """
TPT V7 and V8, as `.xlsx` or as CSV separated by semicolon, comma, pipe or tab. The version is taken from field
1000 or from the V8-only fields 150/151; you can also set it by hand. The header row is found automatically among
the first 50 rows, and columns may be named `12`, `12_CIC_code_of_the_instrument` or just the field name.
"""

[[faq]]
q = "Is the conversion lossless?"
a = """
Yes, for TPT → FundsXML → TPT. Values without an element in FundsXML 4.2.11 — such as the V8 fields 150/151 or
the codes e1/e2/e3 of field 56 — are kept as custom attributes named `TPT_<field>` and restored on the way back.
The report lists every value that was moved or could not be written.
"""

[[faq]]
q = "Are my files stored?"
a = """
No. Files are processed in memory and discarded after the response. There are no cookies and no client-side
tracking; the anonymous usage statistics count conversions, sizes and durations, never file content or names.
"""

[[faq]]
q = "Can I automate the conversion?"
a = """
Yes. One `POST /api/convert` request converts a file and returns the result plus a JSON report — no account, no
API key. See the [API documentation](/api-docs) for curl, PowerShell and Python examples.
"""

[[faq]]
q = "Does it create one TPT per share class?"
a = """
Yes. TPT is reported per share class: field 1 holds the share class ISIN. A FundsXML share class with its own
portfolio uses it; otherwise the fund portfolio is repeated for each share class. See
[FundsXML to TPT](/guides/fundsxml-to-tpt) for the details.
"""
