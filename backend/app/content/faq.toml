# Home page FAQ: rendered into the static shell (crawlers, no-JS), as FAQPage
# JSON-LD, and available to the SPA via /api/content/faq. Answers are Markdown.

[[faq]]
q = "What does the Fund Data Converter do?"
a = """
It converts a FinDatEx Tripartite Template (TPT V7 or V8) file — Excel or CSV — into a FundsXML 4.2.11 document,
and a FundsXML 4 document back into a TPT file. The FundsXML output contains the Solvency II TPT block and the
regular fund, position and asset structures, and is validated against the FundsXML XSD.
"""

[[faq]]
q = "Which TPT versions and file formats are supported?"
a = """
TPT V7 (25 November 2024) and the final TPT V8 (8 October 2026), as `.xlsx` or as CSV separated by semicolon,
comma, pipe or tab. The version is taken from field 1000 or from the V8-only fields 150/151; you can also set it
by hand. The header row is found automatically among the first 50 rows, and columns may be named `12`,
`12_CIC_code_of_the_instrument` or just the field name.
"""

[[faq]]
q = "Is the conversion lossless?"
a = """
Yes, for TPT → FundsXML → TPT. Values without an element in FundsXML 4.2.11 — such as the V8 fields 150/151, the
codes e1/e2/e3 of field 56 or the issuer code type 2 — are kept as custom attributes named `TPT_<field>` and
restored on the way back. The report lists every value that was moved or could not be written. The one exception
is deliberate: a V8 output leaves the 18 fields V8 no longer maintains empty.
"""

[[faq]]
q = "Are my files stored?"
a = """
No. Files are processed in memory and discarded after the response. There are no cookies and no third-party
tracking. The usage statistics count conversions (formats, sizes, durations, message codes) and whether
a result was downloaded or handed over to another site – never file content, file names or values from the file.
Of the funds only the country prefix of the ISIN, the month of the valuation date and an irreversible keyed
fingerprint (to count distinct funds) are kept, never the ISIN or the fund name. See the [privacy policy](/privacy).
"""

[[faq]]
q = "Can I open the result in the XML viewer or check it with the FinDatEx validator?"
a = """
Yes. Below the result, a generated FundsXML file can be opened in [xml-viewer.online](https://www.xml-viewer.online/)
together with the FundsXML schema, so it is validated there right away, and a generated TPT file can be checked in
[findatex-validator.eu](https://www.findatex-validator.eu/), which validates it against the TPT version it was
written for. The file goes from your browser tab straight to the new tab; it is not stored on the way.
"""

[[faq]]
q = "Can I automate the conversion?"
a = """
Yes. One `POST /api/convert` request converts a file and returns the result plus a JSON report — no account, no
API key. See the [API documentation](/api-docs) for curl, PowerShell and Python examples.
"""

[[faq]]
q = "Does it create one TPT per share class?"
a = """
Yes. TPT is reported per share class: field 1 holds the share class ISIN. A FundsXML share class with its own
portfolio uses it; otherwise the fund portfolio is repeated for each share class. See
[FundsXML to TPT](/guides/fundsxml-to-tpt) for the details.
"""
