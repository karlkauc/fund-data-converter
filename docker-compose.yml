# Local deployment behind Apache (converter.status20.net → 127.0.0.1:8095).
services:
  tpt-fundsxml-converter:
    build:
      context: .
      # Deploy with GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: tpt-fundsxml-converter:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8080"
    # Usage statistics (docs/USAGE_STATS.md): USAGE_DB_URL, USAGE_DB_PASSWORD,
    # USAGE_HASH_SECRET (same value as on Cloud Run) and MAXMIND_LICENSE_KEY.
    # Without the file the container runs without statistics.
    env_file:
      - path: .env
        required: false
    environment:
      LOG_LEVEL: INFO
      MAX_UPLOAD_MB: "25"
      MAX_POSITIONS: "10000"
      MAX_CONCURRENT_CONVERSIONS: "1"
      # Apache appends the client IP to X-Forwarded-For.
      TRUSTED_PROXY_HOPS: "1"
      USAGE_INSTANCE: vps
      # Canonical address for search engines; other hosts get X-Robots-Tag: noindex.
      SITE_ORIGIN: ${SITE_ORIGIN:-https://converter.status20.net}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
    mem_limit: 1g
    memswap_limit: 1g  # no swap: an oversized conversion is killed, not slowing the host
    # One conversion at a time needs one core; two leave room for the pages next to it.
    cpus: 2
    pids_limit: 128
    # The app writes nothing but temporary files (openpyxl's write-only workbooks) to /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
